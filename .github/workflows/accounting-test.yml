
name: Thomas AI Backend Tests

"on":
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run accounting tests
        env:
          NEON_TEST_DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
        run: python test_accounting.py

      - name: Run generation endpoint tests
        run: python -m unittest -v test_generate_endpoint

      - name: Run provider settlement tests
        env:
          NEON_TEST_DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
        run: python test_provider_settlement.py

      - name: Run refund tests
        env:
          NEON_TEST_DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
        run: python test_refund.py

      - name: Run OpenAI cost tests
        run: python -m unittest -v test_openai_cost

      - name: Run Character Replacement credit tests
        run: python -m unittest -v test_character_replace_credits
        
